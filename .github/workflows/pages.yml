name: Deploy preview to GitHub Pages

# Publishes a static preview of the site at
# https://<owner>.github.io/<repo>/ — the whole marketing and SEO surface plus
# the full WhatsApp search flow, which runs in the browser. Pages that need a
# server (fare results, price lock, checkout, accounts, admin, contact form)
# are not part of the preview; deploy to Vercel for those.
#
# ONE-TIME SETUP: GitHub Pages must be turned on for this repository before the
# deploy job can publish. Go to Settings → Pages → "Build and deployment" and
# set Source to "GitHub Actions". (If the deploy still fails, also check
# Settings → Actions → General → Workflow permissions is set to
# "Read and write permissions".) Then re-run this workflow — the build job
# below works either way, so the site is always ready to publish.

on:
  push:
    branches: [claude/travel-ticketing-website-2uop5k, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Project pages live under /<repo>, so the base path is derived from the
      # repository name rather than from the Pages API — that keeps the build
      # working before Pages has been switched on.
      - name: Work out the public URL
        id: url
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "base_path=/${repo}" >> "$GITHUB_OUTPUT"
          echo "base_url=https://${owner,,}.github.io/${repo}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Real photography and brand logos, fetched from Wikimedia Commons at
      # build time and cached between runs. Nothing is committed to the repo.
      - name: Cache downloaded imagery
        uses: actions/cache@v4
        with:
          path: |
            public/images/destinations
            public/images/articles
            public/partners
          key: media-${{ hashFiles('src/data/destinations/*.ts', 'src/data/partners.ts') }}

      - name: Fetch destination photos
        continue-on-error: true
        run: node scripts/fetch-photos.mjs

      - name: Fetch travel-guide photos
        continue-on-error: true
        run: node scripts/fetch-article-photos.mjs

      - name: Fetch partner logos
        continue-on-error: true
        run: node scripts/fetch-brand-logos.mjs

      - name: Strip server-only routes and switch to static export
        env:
          FORCE_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.url.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.url.outputs.base_url }}
        run: node scripts/prepare-static-export.mjs

      - name: Build static site
        env:
          NEXT_PUBLIC_STATIC_PREVIEW: "1"
          # The export serves /path/ — canonical URLs and the sitemap must agree.
          NEXT_PUBLIC_TRAILING_SLASH: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.url.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.url.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Stop Pages from hiding _next/
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enables Pages automatically where the repository's token is allowed to.
      # If this fails, switch Pages on by hand (see the note at the top).
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
